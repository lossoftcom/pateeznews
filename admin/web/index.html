  <meta charset="UTF-8">

  <link rel="icon" type="image/png" href="favicon.png"/>

  <style id="admin-boot-style">
    html,
    body {
      height: 100%;
      margin: 0;
      background: #f5f7f9;
    }

    #admin-boot-splash {
      position: fixed;
      inset: 0;
      z-index: 2147483647;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #f5f7f9;
      color: #2b3d4f;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system,
        BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    .admin-boot-panel {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .admin-boot-mark {
      width: 42px;
      height: 42px;
      border-radius: 12px;
      display: grid;
      place-items: center;
      background: #ffffff;
      box-shadow: inset 0 0 0 1px #dfe5ea;
      color: #6e7479;
      font-size: 24px;
      font-weight: 800;
      line-height: 1;
    }

    .admin-boot-title {
      margin: 0;
      font-size: 16px;
      font-weight: 800;
      letter-spacing: 0;
    }

    .admin-boot-status {
      margin: 3px 0 0;
      font-size: 12px;
      font-weight: 500;
      color: #8a96a3;
      letter-spacing: 0;
    }
  </style>
</head>
<body>
  <div id="admin-boot-splash" aria-label="Admin paneli aciliyor">
    <div class="admin-boot-panel">
      <div class="admin-boot-mark">p</div>
      <div>
        <p class="admin-boot-title">Pateez.com</p>
        <p class="admin-boot-status">Admin panel aciliyor</p>
      </div>
    </div>
  </div>
  <script>
    (() => {
      const removeBootSplash = () => {
        document.getElementById('admin-boot-splash')?.remove();
        document.getElementById('admin-boot-style')?.remove();
      };
      window.addEventListener('flutter-first-frame', removeBootSplash, {
        once: true,
      });

      const currentKey = 'sb-debgdvrkcqhtwdyrqves-auth-token';
      const legacyKeys = ['pateeznews-supabase-auth', 'supabase-auth-token'];
      try {
        if (!window.localStorage.getItem(currentKey)) {
          for (const legacyKey of legacyKeys) {
            const raw = window.localStorage.getItem(legacyKey);
            if (!raw) continue;
            try {
              const parsed = JSON.parse(raw);
              const token =
                parsed?.access_token ||
                parsed?.currentSession?.access_token ||
                parsed?.session?.access_token;
              if (token) {
                window.localStorage.setItem(currentKey, raw);
                break;
              }
            } catch (_) {}
          }
        }
        for (const legacyKey of legacyKeys) {
          window.localStorage.removeItem(legacyKey);
          window.localStorage.removeItem(`${legacyKey}-code-verifier`);
          window.localStorage.removeItem(`${legacyKey}-user`);
        }
      } catch (_) {}
    })();
  </script>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async></script>
</body>
