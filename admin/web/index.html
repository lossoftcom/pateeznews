  <meta charset="UTF-8">

  <style>
    html,
    body {
      height: 100%;
    }

    body {
      margin: 0;
      background: #F8F9FA;
    }

    #admin-bootstrap-loader {
      position: fixed;
      inset: 0;
      z-index: 2147483647;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #F8F9FA;
      pointer-events: none;
      transition: opacity 180ms ease;
    }

    .admin-bootstrap-loader-inner {
      position: relative;
      width: 92px;
      height: 92px;
    }

    #admin-bootstrap-loader-arc {
      animation: admin-bootstrap-spin 1350ms linear infinite;
      transform-origin: 46px 46px;
    }

    @keyframes admin-bootstrap-spin {
      to {
        transform: rotate(360deg);
      }
    }
  </style>

<body>
  <div id="admin-bootstrap-loader" aria-label="Pateez admin loading" role="status">
    <div class="admin-bootstrap-loader-inner">
      <svg width="92" height="92" viewBox="0 0 92 92" aria-hidden="true">
        <circle cx="46" cy="46" r="40" fill="none" stroke="#F0F3F4" stroke-width="4"/>
        <circle
          id="admin-bootstrap-loader-arc"
          cx="46"
          cy="46"
          r="40"
          fill="none"
          stroke="#EA4335"
          stroke-width="4"
          stroke-linecap="round"
          stroke-dasharray="180.956 70.372"
        />
      </svg>
    </div>
  </div>
  <script>
    (() => {
      const loader = document.getElementById('admin-bootstrap-loader');
      if (!loader) return;

      let poll = 0;
      let timeout = 0;
      let hidden = false;

      const hide = () => {
        if (hidden) return;
        hidden = true;
        if (poll) window.clearInterval(poll);
        if (timeout) window.clearTimeout(timeout);
        loader.style.opacity = '0';
        window.setTimeout(() => {
          if (loader.parentNode && typeof loader.parentNode.removeChild === 'function') {
            loader.parentNode.removeChild(loader);
          } else {
            loader.style.display = 'none';
          }
        }, 220);
      };

      const hideWhenFlutterFrameExists = () => {
        if (!document.querySelector('flutter-view flt-scene-host, flutter-view canvas, flt-scene-host, canvas')) {
          return false;
        }
        window.setTimeout(hide, 120);
        return true;
      };

      window.addEventListener('flutter-first-frame', hide, { once: true });

      if (hideWhenFlutterFrameExists()) return;

      const observer = new MutationObserver(() => {
        if (hideWhenFlutterFrameExists()) observer.disconnect();
      });
      observer.observe(document.body, { childList: true, subtree: true });
      poll = window.setInterval(() => {
        if (hideWhenFlutterFrameExists()) observer.disconnect();
      }, 250);
      timeout = window.setTimeout(() => {
        observer.disconnect();
        hide();
      }, 15000);
    })();
  </script>
  <script>
    (() => {
      const currentKey = 'sb-debgdvrkcqhtwdyrqves-auth-token';
      const legacyKeys = ['pateeznews-supabase-auth', 'supabase-auth-token'];
      try {
        if (!window.localStorage.getItem(currentKey)) {
          for (const legacyKey of legacyKeys) {
            const raw = window.localStorage.getItem(legacyKey);
            if (!raw) continue;
            try {
              const parsed = JSON.parse(raw);
              const token =
                parsed?.access_token ||
                parsed?.currentSession?.access_token ||
                parsed?.session?.access_token;
              if (token) {
                window.localStorage.setItem(currentKey, raw);
                break;
              }
            } catch (_) {}
          }
        }
        for (const legacyKey of legacyKeys) {
          window.localStorage.removeItem(legacyKey);
          window.localStorage.removeItem(`${legacyKey}-code-verifier`);
          window.localStorage.removeItem(`${legacyKey}-user`);
        }
      } catch (_) {}
    })();
  </script>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async></script>
</body>
