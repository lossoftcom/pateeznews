<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Pateez yönetim paneli.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Pateez">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Pateez</title>
  <link rel="manifest" href="manifest.json">
  <style>
    @font-face {
      font-family: 'RemixIcon';
      src: url('assets/assets/fonts/remixicon/RemixIcon.ttf') format('truetype');
      font-display: block;
    }

    html,
    body {
      height: 100%;
    }

    body {
      margin: 0;
      background: #F8F9FA;
    }

    #admin-bootstrap-loader {
      position: fixed;
      inset: 0;
      z-index: 2147483647;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #F8F9FA;
      pointer-events: none;
      transition: opacity 180ms ease;
    }

    .admin-bootstrap-loader-inner {
      position: relative;
      width: 92px;
      height: 92px;
    }

    .admin-bootstrap-brand {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 40px;
      height: 40px;
      display: flex;
      align-items: center;
      justify-content: center;
      box-sizing: border-box;
      overflow: hidden;
      background: #F8F9FA;
      border: 1px solid #F0F3F4;
      border-radius: 4px;
      transform: translate(-50%, -50%);
      transform-origin: center;
    }

    .admin-bootstrap-brand img {
      width: 100%;
      height: 100%;
      box-sizing: border-box;
      padding: 6.4px;
      object-fit: contain;
    }

    .admin-bootstrap-brand-icon {
      color: #EA4335;
      font-family: 'RemixIcon';
      font-size: 19.2px;
      font-style: normal;
      line-height: 1;
    }
  </style>
</head>
<body>
  <div id="admin-bootstrap-loader" aria-label="Pateez admin loading" role="status">
    <div class="admin-bootstrap-loader-inner">
      <svg width="92" height="92" viewBox="0 0 92 92" aria-hidden="true">
        <circle cx="46" cy="46" r="40" fill="none" stroke="#F0F3F4" stroke-width="4"/>
        <circle
          id="admin-bootstrap-loader-arc"
          cx="46"
          cy="46"
          r="40"
          fill="none"
          stroke="#EA4335"
          stroke-width="4"
          stroke-linecap="round"
          stroke-dasharray="180.956 70.372"
        />
      </svg>
      <div id="admin-bootstrap-brand" class="admin-bootstrap-brand">
        <img id="admin-bootstrap-brand-img" alt="" hidden>
        <span id="admin-bootstrap-brand-fallback" class="admin-bootstrap-brand-icon" aria-hidden="true">&#xef8f;</span>
      </div>
    </div>
  </div>
  <script>
    (() => {
      const loader = document.getElementById('admin-bootstrap-loader');
      const arc = document.getElementById('admin-bootstrap-loader-arc');
      const brand = document.getElementById('admin-bootstrap-brand');
      const brandImage = document.getElementById('admin-bootstrap-brand-img');
      const fallback = document.getElementById('admin-bootstrap-brand-fallback');
      if (!loader || !arc || !brand || !brandImage || !fallback) return;

      try {
        const raw = window.localStorage.getItem('flutter.admin_branding_v1');
        let branding = raw ? JSON.parse(raw) : null;
        if (typeof branding === 'string') branding = JSON.parse(branding);
        const markUrl = (branding?.faviconUrl || branding?.logoUrl || '').trim();
        if (markUrl) {
          brandImage.src = new URL(markUrl, window.location.href).href;
          brandImage.hidden = false;
          fallback.hidden = true;
        }
      } catch (_) {}

      brandImage.addEventListener('error', () => {
        brandImage.hidden = true;
        fallback.hidden = false;
      });

      const start = performance.now();
      let frame = 0;
      let hidden = false;

      const animate = (now) => {
        const t = ((now - start) % 1350) / 1350;
        const radians = t * Math.PI * 2;
        const angle = (radians + 0.5 * Math.sin(radians)) * 180 / Math.PI;
        const pulse = 0.97 + 0.03 * (0.5 + 0.5 * Math.sin(radians));
        arc.setAttribute('transform', `rotate(${angle} 46 46)`);
        brand.style.transform = `translate(-50%, -50%) scale(${pulse})`;
        frame = window.requestAnimationFrame(animate);
      };

      const hide = () => {
        if (hidden) return;
        hidden = true;
        window.cancelAnimationFrame(frame);
        loader.style.opacity = '0';
        window.setTimeout(() => loader.remove(), 220);
      };

      window.addEventListener('flutter-first-frame', hide, { once: true });
      const observer = new MutationObserver(() => {
        if (document.querySelector('flutter-view')) {
          observer.disconnect();
          window.setTimeout(hide, 1200);
        }
      });
      observer.observe(document.body, { childList: true, subtree: true });
      frame = window.requestAnimationFrame(animate);
    })();
  </script>
  <script>
    (() => {
      const currentKey = 'sb-debgdvrkcqhtwdyrqves-auth-token';
      const legacyKeys = ['pateeznews-supabase-auth', 'supabase-auth-token'];
      try {
        if (!window.localStorage.getItem(currentKey)) {
          for (const legacyKey of legacyKeys) {
            const raw = window.localStorage.getItem(legacyKey);
            if (!raw) continue;
            try {
              const parsed = JSON.parse(raw);
              const token =
                parsed?.access_token ||
                parsed?.currentSession?.access_token ||
                parsed?.session?.access_token;
              if (token) {
                window.localStorage.setItem(currentKey, raw);
                break;
              }
            } catch (_) {}
          }
        }
        for (const legacyKey of legacyKeys) {
          window.localStorage.removeItem(legacyKey);
          window.localStorage.removeItem(`${legacyKey}-code-verifier`);
          window.localStorage.removeItem(`${legacyKey}-user`);
        }
      } catch (_) {}
    })();
  </script>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
