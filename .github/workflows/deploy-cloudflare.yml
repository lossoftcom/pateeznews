name: Deploy Cloudflare Production

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: cloudflare-production-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    name: Build Astro + Flutter Admin and deploy Worker
    if: github.repository == 'lossoftcom/pateeznews'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      CLOUDFLARE_ACCOUNT_ID: f7354bacb784efc5561fc5e81ddb804a
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      PUBLIC_SUPABASE_URL: ${{ secrets.PUBLIC_SUPABASE_URL }}
      PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
      SUPABASE_URL: ${{ secrets.PUBLIC_SUPABASE_URL }}
      SUPABASE_PUBLISHABLE_KEY: ${{ secrets.PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
      PATEEZ_ADMIN_API_DB_ROLE: pateez_admin_api

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.44.0
          cache: true

      - name: Install dependencies
        run: npm ci

      - name: Build Astro and Flutter admin web
        run: npm run build:cloudflare

      - name: Deploy to Cloudflare Workers
        run: npx wrangler deploy --keep-vars --route "pateez.com/*" --route "www.pateez.com/*"
